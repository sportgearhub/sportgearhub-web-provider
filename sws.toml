[general]
# Off, so nothing is cached by a default we did not choose: every rule below is deliberate.
cache-control-headers = false
compression = true

[advanced]

# Hashed by the build, so the name changes whenever the bytes do — these can be kept for ever.
[[advanced.headers]]
source = "/assets/**"
headers.Cache-Control = "public, max-age=31536000, immutable"

# Everything else is the HTML shell: this is a single-page app, so every route serves index.html,
# and that file must never be cached. It names the hashed bundle, so a stale copy keeps a browser
# on the previous deploy until it expires — which is exactly what happened: the server's default
# gave it `max-age=86400`, and fixes shipped yesterday were still invisible a day later.
[[advanced.headers]]
source = "/**"
headers.Cache-Control = "no-cache, no-store, must-revalidate"
